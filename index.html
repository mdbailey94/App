<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Athlete Readiness</title>
  <meta name="description" content="Daily athlete wellness check-in with camera-based heart rate and HRV.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="brand-mark" src="icons/icon.svg" alt="" width="28" height="28">
    <h1>Athlete Readiness</h1>
  </header>

  <div id="send-banner" class="send-banner" role="status" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Today</a>
    <a href="#morning" data-tab="checkin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2h4v16H5V5h4zm0 4H7v12h10V7h-2v1H9zm2-2v1h2V5zm-1 9.6l-2-2-1.4 1.4 3.4 3.4 6-6-1.4-1.4z"/></svg>Check-in</a>
    <a href="#workouts" data-tab="workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v2h-2v1.1A8 8 0 1 1 4 13a8 8 0 0 1 7-7.9V4H9zm3 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-1 2h2v4.6l3 1.8-1 1.7-4-2.4zm8.2-2.6 1.4 1.4-1.6 1.6-1.4-1.4z"/></svg>Workouts</a>
    <a href="#goals" data-tab="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>Goals</a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H2V3h2zm2-3l4-5 3 3 5-7 1.6 1.2-6.4 9-3-3-2.6 3.2z"/></svg>History</a>
    <a href="#team" data-tab="team">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm7.5 0a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zM1 20c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5v1H1zm17.4 1c.1-.3.1-.7.1-1 0-2.3-1-4.3-2.7-5.7 4 .2 7.2 2.5 7.2 5.7v1z"/></svg>Team</a>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
