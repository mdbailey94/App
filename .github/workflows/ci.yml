name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button: republish without a code change

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Browser tests: the real app in Chromium with a fake fingertip camera and
  # fake group sheets (see playwright.config.mjs).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Publishes the app to GitHub Pages from main so it can be opened on a phone.
  # Enable it once under Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html coach.html styles.css sw.js manifest.webmanifest coach.webmanifest icons src apps-script _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the same files to Firebase Hosting once the secret
  # FIREBASE_SERVICE_ACCOUNT (the service account's JSON key) is set under
  # Settings → Secrets and variables → Actions. The project ID is read from the
  # key; a FIREBASE_PROJECT_ID repository variable overrides it if present.
  deploy-firebase:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret yet, so skipping the Firebase deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$SA" | jq -e . > /dev/null 2>&1; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret isn't valid JSON. Paste the whole downloaded key file, including the { and }."
            exit 1
          fi
          if [ -z "$PROJECT" ]; then PROJECT=$(printf '%s' "$SA" | jq -r '.project_id // empty'); fi
          if [ -z "$PROJECT" ]; then
            echo "::error::Couldn't find the Firebase project ID in the key. Add a FIREBASE_PROJECT_ID repository variable."
            exit 1
          fi
          echo "Deploying to Firebase project $PROJECT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.enabled == 'true'
        run: mkdir _site && cp -r index.html coach.html styles.css sw.js manifest.webmanifest coach.webmanifest icons src apps-script _site/
      - if: steps.cfg.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.cfg.outputs.project }}
          channelId: live
