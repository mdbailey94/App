name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button: republish without a code change

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Publishes the app to GitHub Pages from main so it can be opened on a phone.
  # Enable it once under Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html styles.css sw.js manifest.webmanifest icons src apps-script _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the same files to Firebase Hosting. Turns on once the repository
  # variable FIREBASE_PROJECT_ID and the secret FIREBASE_SERVICE_ACCOUNT are set
  # (Settings → Secrets and variables → Actions).
  deploy-firebase:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html styles.css sw.js manifest.webmanifest icons src apps-script _site/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
